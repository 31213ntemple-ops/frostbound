org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric 1.21.1 — check https://fabricmc.net/develop for newer builds if you like
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.5
fabric_version=0.105.0+1.21.1

# Trinkets (accessory slots), required at runtime. Pulls in Cardinal Components API 6.1.
trinkets_version=3.10.0

mod_version=1.0.0
maven_group=com.frostbound
archives_base_name=frostbound

# DecorationX: Christmas 1.1.1, run in the dev client and game tests to build and check the
# Christmas structures. Modrinth version ID, not number (Fabric and NeoForge builds share those).
# Supplementaries isn't run in dev: its library Moonlight crashes Fabric's dev environment
# ("Duplicate resource condition fabric:false"), so presents are only checked in a real pack.
decorationx_christmas_version=gww93eT1

# Tough As Nails 10.1.0.13 (temperature; Frostbound turns its thirst off) and the GlitchCore 2.1.0.2
# library it needs, run in the dev client and game tests. Modrinth version IDs.
toughasnails_version=dLxSK1xF
glitchcore_version=sux8kYHe

# Farmer's Delight Refabricated 1.21.1-3.2.8 (its cooking pot makes hot sauce and flame extract), run in the
# dev client and game tests. Modrinth version ID. 3.3.0 and later need Fabric Loader 0.19+ and extend vanilla
# enums with a class tweaker, which Loader can't remap in a dev run ("Failed to remap mods"), so dev stays on
# 3.2.8. Frostbound doesn't compile against FD (only JSON recipes and tags), so players can use any 1.21.1 build.
farmersdelight_version=YEHRH8LC
