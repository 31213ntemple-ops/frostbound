plugins {
	id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Automated in-game tests live in src/gametest. They're a separate source set so
// they never end up in the jar you ship. Run them with: gradlew runGametest
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	mods {
		frostbound {
			sourceSet sourceSets.main
		}
		"frostbound-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		// Headless server that runs every @GameTest, then exits (non-zero if any fail).
		gametest {
			server()
			name "Game Test"
			source sourceSets.gametest
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/junit.xml"
			runDir "build/gametest"
			// gradlew runGametest -PbuildStructures: also (re)build the structure templates (ChristmasStructureBuilder).
			if (project.hasProperty("buildStructures")) {
				vmArg "-Dfrostbound.buildStructures=true"
			}
		}
		// Dev tool: gradlew runScenes opens a client that stages the Alpha Wolf content, screenshots it
		// into build/scenes/screenshots, and quits (SceneShots in src/gametest).
		scenes {
			client()
			name "Scenes"
			source sourceSets.gametest
			vmArg "-Dfrostbound.scenes=true"
			runDir "build/scenes"
		}
		configureEach {
			// Lets dev-only tools (e.g. the structure builder) write into src/main/resources.
			vmArg "-Dfrostbound.projectDir=${project.projectDir}"
		}
	}
}

repositories {
	// Trinkets (accessory slots: the Mark of the Pack is a necklace) and the Cardinal Components it builds on.
	exclusiveContent {
		forRepository {
			maven {
				name = "TerraformersMC"
				url = "https://maven.terraformersmc.com/releases"
			}
		}
		filter {
			includeGroup "dev.emi"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Ladysnake"
				url = "https://maven.ladysnake.org/releases"
			}
		}
		filter {
			includeGroupAndSubgroups "org.ladysnake"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

configurations {
	devMods {
		transitive = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Trinkets: required. The Mark of the Pack (Alpha Wolf drop) is worn in its necklace slot.
	modImplementation "dev.emi:trinkets:${project.trinkets_version}"

	// DecorationX: Christmas, for building and testing the Christmas structures in dev. See devMods below.
	devMods "maven.modrinth:decorationx-christmas:${project.decorationx_christmas_version}"
	// Tough As Nails (and GlitchCore), for testing the No Thirst module.
	devMods "maven.modrinth:tough-as-nails:${project.toughasnails_version}"
	devMods "maven.modrinth:glitchcore:${project.glitchcore_version}"
}

// Other mods to play-test with in dev. They were built with a newer Loom than this project
// uses, so instead of Loom's mod* configurations they're copied as-is into each run's mods
// folder, and Fabric Loader remaps them when the game starts. Never part of the built jar.
def syncDevMods = tasks.register("syncDevMods") {
	inputs.files(configurations.devMods)
	outputs.dirs("run/mods", "build/gametest/mods")
	doLast {
		["run/mods", "build/gametest/mods"].each { dir ->
			project.sync {
				from configurations.devMods
				into dir
			}
		}
	}
}

tasks.matching { it.name in ["runClient", "runServer", "runGametest"] }.configureEach {
	dependsOn syncDevMods
}

// Blockbench models: every .bbmodel in src/<set>/blockbench/{block,item,entity} becomes game files
// (models, textures, entity model data) in build/generated/blockbench/<set>, which is part of that
// source set's resources. See src/main/blockbench/README.md.
def importBlockbench = tasks.register("importBlockbench", frostbound.blockbench.ImportBlockbenchTask) {
	group = "frostbound"
	description = "Converts the Blockbench projects in src/main/blockbench into models and textures."
	sourceDir = file("src/main/blockbench")
	resourcesDir = file("src/main/resources")
	namespace = "frostbound"
	outputDir = layout.buildDirectory.dir("generated/blockbench/main")
}
def importBlockbenchGametest = tasks.register("importBlockbenchGametest", frostbound.blockbench.ImportBlockbenchTask) {
	group = "frostbound"
	description = "Converts the test fixtures in src/gametest/blockbench."
	sourceDir = file("src/gametest/blockbench")
	resourcesDir = file("src/gametest/resources")
	namespace = "frostbound"
	outputDir = layout.buildDirectory.dir("generated/blockbench/gametest")
}
sourceSets.main.resources.srcDir(importBlockbench)
sourceSets.gametest.resources.srcDir(importBlockbenchGametest)

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
